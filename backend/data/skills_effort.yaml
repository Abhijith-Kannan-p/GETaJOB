# Effort to reach working, portfolio-level familiarity with a skill. MY ESTIMATES, not measured data:
# the UI labels them "my estimate". Edit freely. Unlisted skills use default_tier.
note: "Rough hour estimates for a student to reach working familiarity; the author's estimates, not measured."
tiers:
  low: 10
  medium: 30
  high: 80
default_tier: medium

# Not suggested as "fixes" (they still count for matching): not learnable in hours, too vague to act on, or
# working habits picked up on the job rather than learning-plan items.
not_suggestible: [Computer Science Degree, Communication, Collaboration, Mentorship, Problem Solving,
  Code Review, Debugging, Agile, Jira, Technical Writing]

