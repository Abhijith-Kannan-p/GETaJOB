# Skill taxonomy for rule-based extraction. ONE SKILL PER LINE. Hand-edit freely.
#   name:    canonical name shown in the UI and stored in jobs.required_skills
#   aliases: other spellings, matched case-insensitively on word boundaries
#   case:    true => the NAME is matched case-sensitively (for words like Go, R, React, Spark, Excel)
#   case_aliases: extra aliases matched case-sensitively (e.g. Spark -> Apache Spark)
#   block:   phrases that, if they contain the match, cancel it (e.g. "Series C")
# Matching keeps the longest non-overlapping match, so "Objective-C" beats "C".
# After editing, re-run: python -m app.ingest.run --no-embed  (re-fetches boards; skills update, NO embedding calls,
# because content_hash covers only the source text)
