# Nightly job sync into Neon, plus a manual one-off fixture seed.
# Runs at 08:30 UTC, just after Gemini's daily quota resets (midnight Pacific = 07:00/08:00 UTC),
# so the nightly embedding batch gets the full ingest budget (EMBED_RPD - EMBED_RESERVE_RPD).
name: sync

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = fetch boards + embed within budget; seed-fixtures = load the committed snapshot (no API calls)"
        type: choice
        options: [sync, seed-fixtures]
        default: sync
      embed_limit:
        description: "max rows to embed this run (blank = ingest budget)"
        required: false
        default: ""

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMBED_MODEL: ${{ secrets.EMBED_MODEL }}
      EMBED_DIM: "768"
      EMBED_RPM: "80"
      EMBED_RPD: "800"
      EMBED_TPM: "24000"
      EMBED_RESERVE_RPD: "250"
      MAX_ACTIVE_JOBS: "1000"
      MOCK_LLM: "0"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m app.db.migrate
      - name: Seed fixtures (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'seed-fixtures'
        run: python -m app.ingest.seed --fixtures
      - name: Sync boards and embed within budget
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        env:
          EMBED_LIMIT: ${{ inputs.embed_limit }}  # via env, never interpolated into the script
        run: |
          if [ -n "$EMBED_LIMIT" ]; then
            case "$EMBED_LIMIT" in *[!0-9]*) echo "embed_limit must be a number"; exit 1;; esac
            python -m app.ingest.run --embed-limit "$EMBED_LIMIT"
          else
            python -m app.ingest.run
          fi
